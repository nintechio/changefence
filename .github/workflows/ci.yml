name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.22.x", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -buildvcs=false ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -race ./...
      - name: Vulnerability analysis
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  container:
    name: Docker Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Action image
        run: docker build --tag changefence:ci .
      - name: Verify packaged binary and non-root user
        shell: bash
        run: |
          test "$(docker run --rm changefence:ci -version)" = "action"
          docker run --rm --entrypoint /usr/bin/id changefence:ci | grep -q 'uid=10001(changefence)'
