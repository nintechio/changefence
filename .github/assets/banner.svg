<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Changefence — trusted diff scope enforcement, by Nintech">
  <title>Changefence — Trusted diff scope enforcement</title>
  <defs>
    <linearGradient id="brand" x1="88" y1="214" x2="650" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="15" y1="50" x2="49" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#60a5fa" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#94a3b8" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="400" rx="24"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9Z" fill="#64748b"/>
    </marker>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#060509"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <ellipse cx="1020" cy="120" rx="420" ry="300" fill="url(#glowViolet)"/>
    <ellipse cx="180" cy="330" rx="420" ry="280" fill="url(#glowBlue)"/>
    <ellipse cx="1180" cy="360" rx="300" ry="220" fill="url(#glowOrange)"/>

    <g transform="translate(88,56) scale(0.5)">
      <path d="M15 50 L15 27 C15 20.2 17.4 19.11 22.5 23.6 L41.5 40.4 C46.6 44.89 49 43.8 49 37 L49 14"
            fill="none" stroke="url(#markGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="128" y="86" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="17" font-weight="700" letter-spacing="4.5" fill="#f8fafc">NINTECH</text>
    <text x="288" y="86" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12.5" letter-spacing="1.6" fill="#64748b">· OPEN SOURCE</text>

    <text x="86" y="210" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="79" font-weight="800" letter-spacing="-2" fill="url(#brand)">changefence</text>
    <text x="90" y="260" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="26" font-weight="500" fill="#e2e8f0">Trusted scope enforcement for every diff</text>
    <text x="90" y="295" font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="18" fill="#8b93a7">Set the boundary. Catch the surprise.</text>

    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" letter-spacing="1">
      <g><rect x="88" y="326" width="140" height="32" rx="16" fill="#fff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.35"/><text x="158" y="347" fill="#7cb8ff" text-anchor="middle">BASE-TRUSTED</text></g>
      <g><rect x="238" y="326" width="142" height="32" rx="16" fill="#fff" fill-opacity="0.04" stroke="#8b5cf6" stroke-opacity="0.35"/><text x="309" y="347" fill="#c4b5fd" text-anchor="middle">DETERMINISTIC</text></g>
      <g><rect x="390" y="326" width="104" height="32" rx="16" fill="#fff" fill-opacity="0.04" stroke="#f97316" stroke-opacity="0.38"/><text x="442" y="347" fill="#fdba74" text-anchor="middle">ZERO DEPS</text></g>
    </g>

    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="744" y="109" font-size="11" letter-spacing="1.4" fill="#64748b">PROPOSED DIFF</text>
      <g font-size="12">
        <rect x="742" y="126" width="130" height="34" rx="8" fill="#fff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.4"/><text x="758" y="148" fill="#cbd5e1">src/auth.go</text>
        <rect x="742" y="174" width="130" height="34" rx="8" fill="#fff" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.4"/><text x="758" y="196" fill="#cbd5e1">auth_test.go</text>
        <rect x="742" y="222" width="130" height="34" rx="8" fill="#fff" fill-opacity="0.04" stroke="#f97316" stroke-opacity="0.5"/><text x="758" y="244" fill="#fdba74">workflow.yml</text>
      </g>

      <g stroke-linecap="round">
        <path d="M887 143 H936" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
        <path d="M887 191 H936" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
        <path d="M887 239 H936" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
        <g stroke="#8b5cf6" stroke-width="3" opacity="0.85">
          <path d="M952 116 V270"/><path d="M968 116 V270"/><path d="M984 116 V270"/>
        </g>
      </g>
      <text x="968" y="293" text-anchor="middle" font-size="11" letter-spacing="1.3" fill="#a78bfa">POLICY</text>

      <path d="M1000 159 H1080" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)"/>
      <path d="M1000 215 H1080" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow)"/>
      <g>
        <rect x="1092" y="136" width="112" height="44" rx="12" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.55"/>
        <text x="1148" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#6ee7b7">IN SCOPE</text>
        <rect x="1092" y="193" width="112" height="44" rx="12" fill="#f97316" fill-opacity="0.08" stroke="#f97316" stroke-opacity="0.55"/>
        <text x="1148" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#fdba74">REVIEW</text>
      </g>
      <text x="974" y="337" text-anchor="middle" font-size="11.5" fill="#64748b">explicit rules · explainable verdict</text>
    </g>

    <rect x="0" y="396" width="1280" height="4" fill="url(#hairline)"/>
  </g>
</svg>
