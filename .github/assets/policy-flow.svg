<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Changefence trust and evaluation flow">
  <title>Changefence trust and evaluation flow</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="420"><stop stop-color="#60a5fa"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5 0 9Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="420" rx="16" fill="#060509"/><rect width="1200" height="3" fill="url(#accent)"/>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" letter-spacing="1.5" fill="#64748b">
    <text x="54" y="52">TRUSTED INPUT</text><text x="344" y="52">UNTRUSTED INPUT</text><text x="634" y="52">EVALUATOR</text><text x="924" y="52">RESULT</text>
  </g>
  <g font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif">
    <g><rect x="48" y="82" width="230" height="112" rx="14" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.5"/><text x="70" y="119" font-size="18" font-weight="700" fill="#f8fafc">Base commit</text><text x="70" y="149" font-size="14" fill="#9dbbe0">.changefence.json</text><text x="70" y="172" font-size="13" fill="#64748b">rules cannot be weakened by PR</text></g>
    <g><rect x="338" y="82" width="230" height="112" rx="14" fill="#f97316" fill-opacity="0.07" stroke="#f97316" stroke-opacity="0.48"/><text x="360" y="119" font-size="18" font-weight="700" fill="#f8fafc">Proposed change</text><text x="360" y="149" font-size="14" fill="#fdba74">git diff base...HEAD</text><text x="360" y="172" font-size="13" fill="#64748b">paths · statuses · line counts</text></g>
    <g><rect x="628" y="82" width="230" height="240" rx="14" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.52"/><text x="650" y="119" font-size="18" font-weight="700" fill="#f8fafc">Changefence core</text><g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#c4b5fd"><text x="650" y="160">scope globs</text><text x="650" y="190">churn budgets</text><text x="650" y="220">protected paths</text><text x="650" y="250">test coupling</text><text x="650" y="280">risk zones</text></g><text x="650" y="305" font-size="12.5" fill="#8b93a7">no network · no model · no secrets</text></g>
    <g><rect x="918" y="82" width="234" height="104" rx="14" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.5"/><text x="940" y="119" font-size="18" font-weight="700" fill="#6ee7b7">PASS</text><text x="940" y="149" font-size="13.5" fill="#cbd5e1">inside policy or explicitly approved</text></g>
    <g><rect x="918" y="218" width="234" height="104" rx="14" fill="#f87171" fill-opacity="0.07" stroke="#f87171" stroke-opacity="0.5"/><text x="940" y="255" font-size="18" font-weight="700" fill="#fca5a5">FAIL</text><text x="940" y="285" font-size="13.5" fill="#cbd5e1">named rule, path, zone, and reason</text></g>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M278 138H318"/><path d="M568 138H608"/><path d="M858 145H898"/><path d="M858 270H898"/></g>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5"><rect x="48" y="354" width="1104" height="38" rx="10" fill="#fff" fill-opacity="0.035" stroke="#fff" stroke-opacity="0.1"/><text x="600" y="378" text-anchor="middle" fill="#94a3b8">same diff + same base policy = same explainable verdict</text></g>
</svg>
